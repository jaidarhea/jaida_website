<!--
  OPTIONAL: shows your 3 newest posts on the home page (index.html).
  1) Add these two lines at the VERY top of index.html, above <!DOCTYPE html>:
       ---
       ---
  2) Paste the block below wherever you want it inside <main>.
-->
<section class="latest-posts">
  <h2 class="section-heading">Latest from the blog</h2>
  <ul>
    {% for post in site.posts limit: 3 %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="post-date"> · {{ post.date | date: "%B %-d, %Y" }}</span>
    </li>
    {% endfor %}
  </ul>
  <p><a href="blog.html">All posts &rarr;</a></p>
</section>
