<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Jaida Rhea</title>
    <style>

        * { box-sizing: border-box; }
        :root {
            --forest-green: #1f5f2f;
            --navy-blue: #163a70;
            --text-black: #000000;
            --page-bg: #ffffff;
            --border: #d9dde3;
            --focus: #2f80ed;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--page-bg);
            color: var(--text-black);
            line-height: 1.6;
        }
        .site-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; }
        .header-photo {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: var(--navy-blue);
            font-weight: 700;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
        }
        nav a.active { background: #eef3fb; }
        nav a:focus-visible, button:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }
        .page-title {
            color: var(--forest-green);
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 18px;
        }
        .card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            background: #fff;
            margin-bottom: 18px;
        }
        .section-title {
            color: var(--navy-blue);
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 10px;
        }
        .edit-note {
            margin: 0 0 12px;
            border-left: 4px solid var(--forest-green);
            padding-left: 10px;
        }
        p { margin: 0 0 10px; }
        @media (max-width: 640px) {
            .site-wrap { padding: 0 14px 30px; }
            .header-photo { height: 130px; }
        }

        .profile-photo {
            width: min(320px, 100%);
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            border: 1px solid var(--border);
            object-fit: cover;
            display: block;
            margin-bottom: 16px;
        }
        .name-title {
            color: var(--navy-blue);
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 8px;
        }
    </style>
</head>
<body>
    <div class="site-wrap">
        <!-- HEADER IMAGE INSTRUCTIONS:
             1) Keep your shared narrow landscape banner image in /photos/header-photo.png.
             2) To replace it, upload a new file to that same path OR update the src below to another relative path.
             3) Keep a descriptive alt text for accessibility. -->
        <img src="photos/header-photo.png" alt="Website header landscape banner" class="header-photo">
        <header>
            <nav aria-label="Primary">
                <a href="index.html" class="active" aria-current="page">Home</a>
                <a href="research.html">Research</a>
                <a href="publications.html">Publications</a>
                <a href="photos.html">Photos from the Field</a>
            </nav>
        </header>
        <main>
            <h1 class="page-title">Home</h1>
            <section class="card" aria-labelledby="about-me-heading">
                <h2 id="about-me-heading" class="section-title">About Me</h2>
                <!-- PROFILE PHOTO INSTRUCTIONS:
                     1) Upload your profile photo to /photos/about-photo.jpg.
                     2) Replace the src below if your filename/path is different.
                     3) Replace alt text so it clearly describes your photo. -->
                <img src="photos/about-photo.jpg" alt="Profile photo placeholder" class="profile-photo">
                <p class="edit-note">Edit the two placeholders below for your personal intro content.</p>
                <!-- EDIT NAME/TITLE BELOW -->
                <p class="name-title">[Your Name and Professional Title]</p>
                <!-- EDIT SUMMARY/BIO BELOW -->
                <p>[Write your summary/bio text here. Include your program, research interests, and goals.]</p>
            </section>
        </main>
    </div>
</body>
</html>
